<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas - Proyecto 1</title>
    <!-- Conectamos la hoja de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Mis Tareas</h1>
        
        <div class="caja-formulario">
            <!-- Formulario para agregar tareas -->
            <form id="form-tarea">
                <div class="grupo-input">
                    <label for="titulo">Título de la tarea:</label>
                    <input type="text" id="titulo" placeholder="Ej. Terminar laboratorio de Programación" required>
                </div>
                
                <div class="grupo-input">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" placeholder="Hacer el diagrama de clases y compilar en TypeScript..." required></textarea>
                </div>
                
                <button type="submit" class="btn-guardar">Agregar Tarea</button>
            </form>
        </div>

        <div class="caja-lista">
            <h2>Tareas Pendientes y Completadas</h2>
            <!-- Aquí TypeScript inyectará los elementos <li> -->
            <ul id="lista-tareas"></ul>
        </div>
    </div>

    <!-- Script principal compilado -->
    <!-- Nota: Dependiendo de tu configuración de TypeScript, aquí va app.js -->
    <script type="module" src="./dist/app.js"></script>
</body>
</html>
